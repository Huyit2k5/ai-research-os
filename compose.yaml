services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: research_os
      POSTGRES_USER: research_os
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research_os -d research_os"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  web:
    build: ./apps/web
    environment:
      DATABASE_URL: postgresql://research_os:${POSTGRES_PASSWORD}@db:5432/research_os
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?Set CREDENTIAL_ENCRYPTION_KEY in .env}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
